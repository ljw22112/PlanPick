<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlanPick 대학 대시보드 (모의 데이터)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root { --ink: #1b1f2a; --muted: #6b7280; --line: #e5e7ee; --accent: #3b5bfd; font-family: 'Pretendard', sans-serif; color: var(--ink); background: #f4f5f8; }
    body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }
    h1 { font-size: 18px; margin: 0; }
    header p { margin: 0; color: var(--muted); font-size: 12.5px; }
    header a { margin-left: auto; font-size: 13px; color: var(--accent); }
    main { max-width: 1120px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(4, 1fr); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .kpi .v { font-size: 26px; font-weight: 800; margin-top: 4px; }
    .kpi .l { color: var(--muted); font-size: 12.5px; }
    .kpi .d { font-size: 12px; margin-top: 2px; }
    .wide { grid-column: span 2; } .full { grid-column: 1 / -1; }
    h2 { font-size: 14px; margin: 0 0 2px; } .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .badge { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; }
    .hi { background: #fdecec; color: #a12a2a; } .mid { background: #fff7e6; color: #b45309; } .ok { background: #e8f8f0; color: #137a4b; }
    .note { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
    svg text { font-family: inherit; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr 1fr; } .wide { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">P</div>
    <div><h1>PlanPick 대학 대시보드</h1><p>학생 개인 정보 없이 학과·학년 단위 익명 통계만 보여주는 B2B 화면 · 모든 수치는 모의 데이터</p></div>
    <a href="./">← 학생용 PlanPick</a>
  </header>
  <main id="app"></main>
  <script>
    // 결정적 의사난수(시드 고정) → 새로고침해도 같은 모의 데이터
    let seed = 42;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const depts = ['인공지능데이터사이언스', '컴퓨터공학', '나노신소재공학', '경영학부', '디자인이노베이션'];
    const weeks = Array.from({ length: 16 }, (_, i) => i + 1);
    const load = depts.map((d, i) => weeks.map(w => {
      const exam = (w >= 7 && w <= 8) || (w >= 14 && w <= 15) ? 1 : 0;
      return Math.round(38 + i * 1.5 + exam * (12 + rnd() * 6) + (w > 10 ? 3 : 0) + rnd() * 5);
    }));
    const students = depts.map(() => 40 + Math.round(rnd() * 60));
    const burn = depts.map((_, i) => Math.round(8 + rnd() * 14 + (i === 2 ? 6 : 0)));
    const achieve = depts.map(() => Math.round(58 + rnd() * 22));
    const sleep = depts.map(() => (5.6 + rnd() * 1.4).toFixed(1));
    const totalStu = students.reduce((a, b) => a + b, 0);
    const avgBurn = Math.round(burn.reduce((a, b, i) => a + b * students[i], 0) / totalStu);
    const cur = 11;
    const curLoad = Math.round(load.reduce((a, l, i) => a + l[cur - 1] * students[i], 0) / totalStu);

    const colors = ['#3b5bfd', '#0fa3b1', '#e5484d', '#f59e0b', '#8b5cf6'];
    const W = 680, H = 240, L = 40, B = 28, T = 14, R = 12;
    const maxY = 70, minY = 30;
    const x = w => L + ((w - 1) / 15) * (W - L - R);
    const y = v => T + (1 - (v - minY) / (maxY - minY)) * (H - T - B);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="학과별 주간 평균 부하">`;
    for (const v of [30, 40, 50, 60, 70]) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f5"/><text x="${L - 6}" y="${y(v) + 4}" font-size="10.5" text-anchor="end" fill="#6b7280">${v}h</text>`;
    for (const [a, b, n] of [[7, 8, '중간'], [14, 15, '기말']]) svg += `<rect x="${x(a) - 8}" y="${T}" width="${x(b) - x(a) + 16}" height="${H - T - B}" fill="#fff4e5"/><text x="${(x(a) + x(b)) / 2}" y="${T + 12}" font-size="10.5" text-anchor="middle" fill="#b45309">${n}고사</text>`;
    for (const w of weeks) if (w % 2 === 1 || w === 16) svg += `<text x="${x(w)}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="#6b7280">${w}주</text>`;
    svg += `<line x1="${x(cur)}" x2="${x(cur)}" y1="${T}" y2="${H - B}" stroke="#1b1f2a" stroke-dasharray="3 3"/><text x="${x(cur) + 4}" y="${T + 24}" font-size="10.5" fill="#1b1f2a">이번 주</text>`;
    load.forEach((l, i) => { svg += `<polyline fill="none" stroke="${colors[i]}" stroke-width="2" points="${l.map((v, j) => `${x(j + 1)},${y(v)}`).join(' ')}"/>`; });
    svg += '</svg>';
    const legend = depts.map((d, i) => `<span style="margin-right:12px;font-size:12px"><b style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${colors[i]};margin-right:4px"></b>${d}</span>`).join('');

    const rows = depts.map((d, i) => {
      const lv = burn[i] >= 20 ? 'hi' : burn[i] >= 14 ? 'mid' : 'ok';
      return `<tr><td>${d}</td><td>${students[i]}명</td><td>${load[i][cur - 1]}h</td><td>${achieve[i]}%</td><td>${sleep[i]}h</td><td><span class="badge ${lv}">${burn[i]}%</span></td></tr>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      <div class="card kpi"><div class="l">이용 학생 (모의)</div><div class="v">${totalStu}명</div><div class="d" style="color:#137a4b">학기 4주 잔존 41%</div></div>
      <div class="card kpi"><div class="l">이번 주 평균 부하</div><div class="v">${curLoad}h</div><div class="d" style="color:var(--muted)">수업+공부+알바+대외활동+통학</div></div>
      <div class="card kpi"><div class="l">번아웃 위험 학생 비율</div><div class="v">${avgBurn}%</div><div class="d" style="color:#a12a2a">주 60시간 초과 또는 쉬는 날 0일</div></div>
      <div class="card kpi"><div class="l">계획 달성률</div><div class="v">${Math.round(achieve.reduce((a, b) => a + b, 0) / achieve.length)}%</div><div class="d" style="color:var(--muted)">완료 블록 / 배치 블록</div></div>
      <div class="card full"><h2>학과별 주간 평균 부하 (학기 16주)</h2><div class="sub">시험기간에 부하가 몰리는 학과를 미리 보고 튜터링·상담 프로그램 시점을 정할 수 있어요.</div>${svg}<div>${legend}</div></div>
      <div class="card full"><h2>학과별 현황 (이번 주)</h2><div class="sub">5명 미만 집단은 표시하지 않아요(재식별 방지).</div>
        <table><thead><tr><th>학과</th><th>이용 학생</th><th>평균 부하</th><th>달성률</th><th>평균 수면</th><th>번아웃 위험</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="note">이 화면은 PlanPick의 대학 대상(B2B) 수익 모델을 설명하기 위한 시연이에요. 실제 서비스는 학생 동의를 받은 익명 집계만 사용하고, 개인 일정·과제 내용은 대학에 제공하지 않아요.</div>`;
  </script>
</body>
</html>
